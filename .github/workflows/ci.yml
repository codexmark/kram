# Named "Kram" (not "ci") on purpose: GitHub Actions names each check run
# "<workflow name> / <job name>", and this is what makes them show up as
# "Kram / Build", "Kram / Vet", "Kram / Format", "Kram / Test Race",
# "Kram / CI" — the exact, stable names to use later for required status
# checks in branch protection.
name: Kram

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repo and publishes a classic
# commit status for its own result (see .github/actions/report-status).
# Nothing here needs to write repo contents, comment on PRs, or trigger
# other workflows.
permissions:
  contents: read
  statuses: write

# A new push to the same branch/PR supersedes the previous run instead of
# both running to completion — saves Actions minutes and avoids a stale
# run's status racing a newer one to report last.
concurrency:
  group: kram-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # github.sha on a pull_request event is the ephemeral GitHub-generated
  # merge commit, not a SHA that will ever exist in the repo's real
  # history — external tooling auditing "did this commit pass CI" needs
  # the actual PR branch tip instead. On push, there is no pull_request
  # context, so this falls through to github.sha (the real pushed commit).
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/report-status
        with:
          context: kram/build
          state: pending
          sha: ${{ env.SHA }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build ./...
        run: go build ./...

      - if: success()
        uses: ./.github/actions/report-status
        with:
          context: kram/build
          state: success
          sha: ${{ env.SHA }}
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          context: kram/build
          state: failure
          description: go build failed
          sha: ${{ env.SHA }}
      - if: cancelled()
        uses: ./.github/actions/report-status
        with:
          context: kram/build
          state: error
          description: cancelled
          sha: ${{ env.SHA }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/report-status
        with:
          context: kram/vet
          state: pending
          sha: ${{ env.SHA }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet ./...
        run: go vet ./...

      - if: success()
        uses: ./.github/actions/report-status
        with:
          context: kram/vet
          state: success
          sha: ${{ env.SHA }}
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          context: kram/vet
          state: failure
          description: go vet failed
          sha: ${{ env.SHA }}
      - if: cancelled()
        uses: ./.github/actions/report-status
        with:
          context: kram/vet
          state: error
          description: cancelled
          sha: ${{ env.SHA }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/report-status
        with:
          context: kram/format
          state: pending
          sha: ${{ env.SHA }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CI validates formatting, it never rewrites files — an agent or
      # developer runs `gofmt -w` locally and pushes the fix.
      - name: gofmt -l .
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - if: success()
        uses: ./.github/actions/report-status
        with:
          context: kram/format
          state: success
          sha: ${{ env.SHA }}
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          context: kram/format
          state: failure
          description: gofmt found unformatted files
          sha: ${{ env.SHA }}
      - if: cancelled()
        uses: ./.github/actions/report-status
        with:
          context: kram/format
          state: error
          description: cancelled
          sha: ${{ env.SHA }}

  test-race:
    name: Test Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/report-status
        with:
          context: kram/test-race
          state: pending
          sha: ${{ env.SHA }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The race detector stays on deliberately — Kram has a lot of
      # concurrent code (gateway, daemon, streaming, routing, MCP, LSP,
      # subagents, process manager, TUI event handling) and this is part
      # of the project's reliability model, not something to drop for a
      # faster pipeline. See DECISIONS.md.
      - name: go test ./... -race
        run: go test ./... -race

      - if: success()
        uses: ./.github/actions/report-status
        with:
          context: kram/test-race
          state: success
          sha: ${{ env.SHA }}
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          context: kram/test-race
          state: failure
          description: go test -race failed
          sha: ${{ env.SHA }}
      - if: cancelled()
        uses: ./.github/actions/report-status
        with:
          context: kram/test-race
          state: error
          description: cancelled
          sha: ${{ env.SHA }}

  # Aggregate: answers "is this commit healthy?" in one place without
  # re-running anything build/vet/format/test-race already did. Runs even
  # if a dependency failed (if: always()) so it can still report its own
  # failure — otherwise a broken dependency would leave "Kram / CI"
  # permanently pending instead of turning it red.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, vet, format, test-race]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/report-status
        with:
          context: kram/ci
          state: pending
          sha: ${{ env.SHA }}

      - name: verify every required check passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "dependency results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "one or more required checks did not succeed"
            exit 1
          fi

      - if: success()
        uses: ./.github/actions/report-status
        with:
          context: kram/ci
          state: success
          sha: ${{ env.SHA }}
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          context: kram/ci
          state: failure
          description: one or more required checks failed
          sha: ${{ env.SHA }}
      - if: cancelled()
        uses: ./.github/actions/report-status
        with:
          context: kram/ci
          state: error
          description: cancelled
          sha: ${{ env.SHA }}
