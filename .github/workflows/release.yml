name: release

# Triggered by pushing a version tag (v1.2.3). Cross-compiles cmd/kram
# for every supported platform (scripts/build-release.sh — the same
# script a maintainer can run locally to reproduce exactly what CI
# produces) and attaches the archives to a GitHub release.
#
# CGO_ENABLED=0 works here with no cross-compiler toolchain and no
# platform-specific build image because of a deliberate early choice:
# the SQLite driver (modernc.org/sqlite) is pure Go, specifically so the
# daemon's storage layer never needs cgo. See DECISIONS.md.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/build-release.sh uses `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build every platform
        run: ./scripts/build-release.sh "${{ github.ref_name }}"

      - name: smoke test the linux/amd64 build
        # The one target CI can actually execute natively — a real
        # `-version` run, not just "it compiled". The other four targets
        # are trusted on the strength of CGO_ENABLED=0 pure-Go build (no
        # target-specific code paths to diverge) plus this same matrix
        # having been hand-verified to build *and run* on darwin/windows
        # during development (see DECISIONS.md).
        run: |
          mkdir -p /tmp/smoke
          tar -xzf dist/kram-${{ github.ref_name }}-linux-amd64.tar.gz -C /tmp/smoke
          out=$(/tmp/smoke/kram-${{ github.ref_name }}-linux-amd64 -version)
          echo "$out"
          echo "$out" | grep -q "${{ github.ref_name }}"

      - name: checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
