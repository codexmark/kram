name: Feature request
description: Propose a change that solves a concrete Kram workflow problem
title: "[FEATURE] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the implementation. A good request explains what is difficult today and why the proposed behavior would help.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent behavior
        - Gateway / provider
        - Routing
        - Tools / permissions
        - TUI
        - Onboarding
        - Sessions / memory
        - Snapshots / artifacts
        - MCP / LSP
        - Installer / release
        - Platform compatibility
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current workflow, limitation, or repeated friction.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What behavior would you like?
      description: Describe the desired outcome. Implementation details are optional.
    validations:
      required: true

  - type: textarea
    id: usefulness
    attributes:
      label: Why would this be useful?
      description: Explain the concrete developer or runtime benefit.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Is there a workaround today?
      description: If yes, describe it and why it is insufficient.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, screenshots, or references are welcome. Do not include credentials or private source code.
